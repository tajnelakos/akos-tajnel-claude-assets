<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><title>ContactBlock</title>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<style>html,body{margin:0;background:#ECEBE6} .z{zoom:1}</style></head><body>
<div class="pwf-board">
<div class="pwf-sheet pwf-paper" style="width:120mm;padding:var(--space-4)"><div class="pwf-contact"><span class="pwf-qr" style="outline:var(--border-hairline) solid var(--line)"></span><div><p class="tri-panel-title pwf-contact__cta">Scan to book a backtest</p><p class="contact pwf-contact__line"><span class="pwf-arrow"></span>seekridge.example/backtest</p><p class="contact pwf-contact__line"><span class="pwf-arrow"></span>hello@seekridge.example</p></div></div></div>
<div class="pwf-sheet pwf-navy" data-theme="dark" style="width:120mm;padding:var(--space-4)"><div class="pwf-contact"><span class="pwf-qr"></span><div><p class="tri-panel-title pwf-contact__cta">Scan to see a moment on your own data</p><p class="contact pwf-contact__line"><span class="pwf-arrow"></span>seekridge.example/demo</p><p class="contact pwf-contact__line"><span class="pwf-arrow"></span>hello@seekridge.example</p></div></div></div>
</div>
</body></html>
