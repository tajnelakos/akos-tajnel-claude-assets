<!-- @dsCard group="Content" height=225 subtitle="Three data layers feeding one moment" -->
<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><title>LayerDiagram</title>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<style>html,body{margin:0;background:#ECEBE6} .z{zoom:1}</style></head><body>
<div class="pwf-board">
<div class="pwf-sheet pwf-paper" style="width:100mm;padding:var(--space-4)"><div class="pwf-layers">
<div class="pwf-layers__chips"><span class="pwf-chip pwf-chip--own label"><span class="pwf-icon pwf-icon--s pwf-i-customer"></span>Customer data</span><span class="pwf-chip label"><span class="pwf-icon pwf-icon--s pwf-i-market"></span>Market data</span><span class="pwf-chip label"><span class="pwf-icon pwf-icon--s pwf-i-parcel"></span>Property data</span></div>
<span class="pwf-layers__join"></span><div class="pwf-layers__moment"><p class="data pwf-muted">Moment</p><p class="tri-panel-title" style="color:var(--navy);margin-top:1mm">Likely to refinance within 6 months</p></div></div></div>
<div class="pwf-sheet pwf-navy" data-theme="dark" style="width:100mm;padding:var(--space-4)"><div class="pwf-layers">
<div class="pwf-layers__chips"><span class="pwf-chip pwf-chip--own label"><span class="pwf-icon pwf-icon--s pwf-i-customer"></span>Customer data</span><span class="pwf-chip label"><span class="pwf-icon pwf-icon--s pwf-i-market"></span>Market data</span><span class="pwf-chip label"><span class="pwf-icon pwf-icon--s pwf-i-parcel"></span>Property data</span></div>
<span class="pwf-layers__join"></span><div class="pwf-layers__moment"><p class="data pwf-muted">Moment</p><p class="tri-panel-title" style="margin-top:1mm">Policy likely underinsured</p></div></div></div>
</div>
</body></html>
