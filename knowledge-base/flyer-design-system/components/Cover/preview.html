<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Seekridge flyers</title>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<style>
  html, body { margin:0; height:100%; background:var(--navy); overflow:hidden; }
  .cover { position:relative; width:960px; height:336px; overflow:hidden; background:var(--navy); color:var(--paper); font-family:var(--font-body); }
  .cover .pwf-motif--grid { width:300px; height:300px; top:0; right:0; }
  .txt { position:absolute; left:48px; bottom:44px; }
  .t { font:800 44px/48px var(--font-display); letter-spacing:-0.01em; margin:0; }
  .s { font:400 16px/24px var(--font-body); color:var(--navy-text); margin:10px 0 0; }
  .e { font:500 11px/14px var(--font-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--navy-text); margin:0 0 14px; }
  .lock { position:absolute; left:48px; top:40px; width:150px; height:38px; background:var(--logo-lockup-paper) left center/contain no-repeat; }
</style>
</head>
<body>
<div class="cover">
  <span class="lock"></span>
  <span class="pwf-motif pwf-motif--grid"></span>
  <div class="txt">
    <p class="e">Print design system</p>
    <p class="t">Seekridge flyers</p>
    <p class="s">A4 trifold · A4 one-pager</p>
  </div>
</div>
</body>
</html>
