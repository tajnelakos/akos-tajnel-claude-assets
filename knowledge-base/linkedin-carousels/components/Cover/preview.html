<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parcelwise LinkedIn carousels</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--navy); color:var(--paper); font-family:var(--font-display); overflow:hidden; }
  .cover { position:relative; width:960px; height:300px; overflow:hidden; }
  .plan { position:absolute; right:0; top:0; }
  .words { position:absolute; left:48px; bottom:36px; right:400px; }
  .name { margin:0; font-size:44px; line-height:1; font-weight:800; letter-spacing:-.01em; }
  .tag { margin:14px 0 0; font-family:var(--font-mono); font-weight:500; font-size:13px; line-height:18px; letter-spacing:.08em; text-transform:uppercase; color:var(--paper-72); }
</style>
</head>
<body>
<div class="cover">
<svg class="plan" viewBox="0 0 400 300" width="400" height="300" aria-hidden="true">
<!-- A parcel plan cut from the cover motif: straight lots in paper at 35%, one lot in gold-light, top-right as in the logomark.
     Divisions on a 20px pitch (the 96px canvas margin is 4.8 of them at this scale); 2px lines, no fills but the one lot. -->
<g fill="none" stroke="#f4f3ef" stroke-opacity=".35" stroke-width="2">
<path d="M0 80h400M0 180h400M0 250h400M140 0v80M280 0v180M80 80v100M200 180v120M330 180v70M1 0v300"/>
</g>
<rect x="282" y="2" width="118" height="76" fill="#d9a54b"/>
</svg>
<div class="words">
  <p class="name">Parcelwise<br>LinkedIn carousels</p>
  <p class="tag">Seven formats and a slide kit · navy and paper</p>
</div>
</div>
</body>
</html>
