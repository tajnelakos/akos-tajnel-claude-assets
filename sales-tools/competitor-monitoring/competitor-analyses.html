<style id="pw-components">
/* Synced from knowledge-base/design-system/components.css by update_region.py sync-styles. Edit the source, not this copy. */

.pw-eyebrow{font-family:var(--font-body, 'IBM Plex Sans', system-ui, sans-serif);font-size:12px;line-height:16px;font-weight:500; ; color:var(--ink-muted); display:inline-flex; align-items:center; align-self:flex-start; padding:6px 13px; border-radius:999px; background:#1A3A5C; color:#fff; font-weight:500; box-shadow:0 2px 0 rgba(15,42,64,.45)}

:focus-visible{outline:var(--border-strong) solid var(--focus);outline-offset:2px}

.pw-btn{display:inline-flex;align-items:center;gap:var(--space-2);font:600 15px/20px var(--font-body);padding:10px var(--space-4);border-radius:var(--radius-md);border:1px solid transparent;cursor:pointer;transition:background var(--motion-fast) var(--ease-standard),border-color var(--motion-fast) var(--ease-standard);text-decoration:none;white-space:nowrap}
.pw-btn--primary{background:var(--action);color:var(--on-action)}
.pw-btn--primary:hover{background:var(--action-hover)}
.pw-btn--secondary{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.pw-btn--secondary:hover{background:var(--surface-sunken)}
.pw-btn--text{background:transparent;color:var(--ink);padding-left:0;padding-right:0;text-decoration:underline;text-underline-offset:3px}
.pw-btn--sm{padding:6px var(--space-3);font-size:14px}

.pw-field{display:flex;flex-direction:column;gap:var(--space-2);max-width:360px}
.pw-field__label{font:500 14px/20px var(--font-body);color:var(--ink)}

.pw-alert{display:flex;gap:var(--space-3);padding:var(--space-3) var(--space-4);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);color:var(--ink);font-size:14px;line-height:20px}

/* Data table */
.pw-table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);font-size:14px;line-height:20px;border-radius:var(--radius-lg);border-collapse:separate;border-spacing:0;overflow:hidden}
.pw-table th{font:500 12px/16px var(--font-body, 'IBM Plex Sans', system-ui, sans-serif); ; color:var(--ink-muted);text-align:left;background:var(--surface-sunken);padding:var(--space-2) var(--space-4);border-bottom:1px solid var(--line)}

.pw-tier li{display:flex;gap:var(--space-2)}

.pw-slide{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:var(--font-body)}

/* Seekridge report-site masthead and footer (from knowledge-base/design-system/report-theme.css) */

.sr-mast { background: var(--navy); color: var(--paper); position: relative; overflow: hidden; }
.sr-mast__bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 24px; flex-wrap: wrap; }

  font: 500 14px/20px var(--font-body); color: var(--paper); text-decoration: none; border: 1px solid rgba(244,243,239,.32); transition: background .15s; }

.sr-mast__grid { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 40px; align-items: center; padding-block: 24px 88px; }

.sr-mast__eyebrow { margin: 0 0 14px; display: inline-flex; padding: 6px 13px; border-radius: var(--r-full); background: var(--gold-light); color: var(--navy-deep); font: 600 13px/1 var(--font-body); box-shadow: 0 2px 0 rgba(0,0,0,.3); }

.sr-mast__title .vs { font: 500 .5em/1 var(--font-body); letter-spacing: 0; color: var(--gold-light); vertical-align: .32em; margin: 0 .3em; }

/* The dot map: open on the navy, in its own column so it never runs into text. Edges fade into the band. */

    r.periods.forEach(function(p){ p.summary.forEach(function(s){ hl.push({period:p.id,name:s.name,text:s.text}); }); });
    var first = r.periods[r.periods.length-1], last = r.periods[0];
    return { id:'year-summary', label: last.id.slice(0,4) + ' summary', coverage: first.label.split('–')[0].trim() + ' – ' + last.label.split('–').pop().trim(),
      note:'Tracking began with the ' + first.label + ' edition; this view grows with each new edition.', highlights: hl };

    if (!region) return location.pathname;
    return location.pathname + '?region=' + region + (edition ? '&edition=' + edition : '');

  // in sandboxed previews that refuse history changes, navigation still works.

  function mast(active, hero){
    return '<header class="sr-mast"><div class="sr-wrap"><div class="sr-mast__bar">' +
      '<a class="sr-lockup" href="' + url(null) + '" data-go="" aria-label="Competitor analyses home"><img src="../../knowledge-base/flyer-design-system/assets/Logos/pw-lockup-paper.svg" alt="Seekridge">' +
      '<span class="sr-lockup__div" aria-hidden="true"></span><span class="sr-lockup__product">Competitor analyses</span></a>' +
      nav(active) + '</div><div class="sr-mast__grid">' + hero + ART + '</div></div></header>';
  }
  function facts(list){ return '<div class="sr-facts">' + list.map(function(f){ return '<span class="sr-fact">' + f + '</span>'; }).join('') + '</div>'; }
  function badge(text, mod){ return '<span class="pw-badge' + (mod ? ' pw-badge--' + mod : '') + '">' + text + '</span>'; }

  // ---------- overview ----------
  function overview(){
    var live = ORDER.filter(function(id){ return R[id].status === 'live'; });
    var analysed = live.reduce(function(n,id){ return n + latest(R[id]).companies.length; }, 0);
    var newest = live.map(function(id){ return latest(R[id]); }).sort(function(a,b){ return a.id < b.id ? 1 : -1; })[0];
    var h = mast('', '<div class="sr-mast__hero"><p class="sr-mast__eyebrow">Competitive intelligence</p>' +
      '<h1 class="sr-mast__title">Competitor analyses</h1>' +
      '<p class="sr-mast__lede">A bi-monthly, sourced record of what named competitors are doing in our three core markets: product moves, partnerships and positioning. No commentary on impact or strategy.</p>' +
      facts(['<b>' + ORDER.length + '</b> regions', '<b>' + analysed + '</b> companies analysed', 'Latest edition <b>' + (newest ? newest.label : '–') + '</b>']) + '</div>');
    h += '<main><div class="wrap lift pw-enter"><div class="regions">' + ORDER.map(card).join('') + '</div>' +
      '<div class="how">' +
        '<div><span class="pw-eyebrow">Every two months</span><h4>One edition per period</h4><p>Each region is researched for a fixed two-month window. Earlier editions stay one click away.</p></div>' +
        '<div><span class="pw-eyebrow">Company-level only</span><h4>News, not market data</h4><p>Funding, launches, leadership, partnerships and positioning. Price indices and thought leadership are left out.</p></div>' +
        '<div><span class="pw-eyebrow">Sourced and neutral</span><h4>A record, not a verdict</h4><p>Every item is dated and carries its source. What it means for us is discussed in the battlecards, not here.</p></div>' +
      '</div></div></main>';
    return h;
  }
  function card(id){
    var r = R[id];
    var head = '<div class="pw-region__head"><span class="pw-region__flags">' + r.flags + '</span><div><h3 class="pw-region__name">' + r.name +
      '</h3><p class="pw-region__countries">' + r.countries + '</p></div></div>';
    if (r.status !== 'live') {
      return '<div class="pw-region pw-region--pending">' + head + '<div class="pw-badges">' + badge('Page to be added', 'warning') + '</div>' +
        '<p class="pw-card__body">This region appears here once its first edition is published.</p></div>';
    }
    var p = latest(r), news = p.companies.filter(has).length;
    return '<a class="pw-region" href="' + url(id) + '" data-go="' + id + '">' + head +
      '<div class="pw-badges">' + badge('Latest: ' + p.label, 'accent') + badge(p.companies.length + ' analysed') + badge(news + ' with news') + '</div>' +
      '<ul class="pw-list">' + p.summary.slice(0,3).map(function(s){ return '<li><b>' + s.name + '</b> &mdash; ' + s.text + '</li>'; }).join('') + '</ul>' +
      '<div class="pw-region__foot"><span class="pw-caption">' + r.periods.length + (r.periods.length === 1 ? ' edition' : ' editions') + ' &middot; published ' + p.published + '</span>' +
      '<span class="pw-btn pw-btn--primary pw-btn--sm">Open ' + r.name + ' <span aria-hidden="true">&rarr;</span></span></div></a>';
  }

  // ---------- region ----------
  function field(title, items){
    var body = (items && items.length) ? items.map(function(it){
      var t = it.text, i = t.indexOf(' &mdash; '), lead = '';
      if (i > 0 && i < 90) { lead = '<span class="lead">' + t.slice(0,i) + '</span> &mdash; '; t = t.slice(i + 9); }
      return '<li>' + lead + t + '<div class="pw-sources">' + it.sources.map(function(s){
        return '<a class="pw-source" href="' + s.url + '" target="_blank" rel="noopener">' + s.label + '</a>'; }).join('') + '</div></li>';
    }).join('') : '<li class="is-empty">No significant developments found in this period</li>';
    return '<div class="pw-entry__field"><h4>' + title + '</h4><ul class="pw-list">' + body + '</ul></div>';
  }
  function regionView(id, edition){
    var r = R[id], y = yearOf(r), isYear = edition === y.id;
    var p = isYear ? null : (r.periods.filter(function(x){ return x.id === edition; })[0] || latest(r));
    var lp = latest(r);
    var hero = '<div class="sr-mast__hero"><p class="sr-mast__eyebrow">Competitor analyses: ' + r.countries + '</p>' +
      '<h1 class="sr-mast__title"><span class="flags">' + r.flags + '</span>' + r.name + ' competitor analysis</h1>' +
      '<p class="sr-mast__lede">A running, bi-monthly record of what named competitors in ' + r.name + ' are doing: product, partnerships and positioning, each item sourced. No commentary on impact or strategy.</p>' +
      facts(['Latest edition <b>' + lp.label + '</b>', 'Published <b>' + lp.published + '</b>', 'Next update <b>' + lp.nextUpdate + '</b>']) + '</div>';
    var h = mast(id, hero);
    var tb = '<div class="pw-editions" role="toolbar" aria-label="Editions">' + r.periods.map(function(x){
        var on = !isYear && x.id === p.id;
        return '<button class="pw-btn pw-btn--secondary pw-btn--sm" data-ed="' + x.id + '" aria-pressed="' + on + '">' + x.label +
          (x.id === lp.id ? ' <span class="pw-editions__latest">Latest</span>' : '') + '</button>';
      }).join('') + '<span class="pw-editions__rule" aria-hidden="true"></span>' +
      '<button class="pw-btn pw-btn--secondary pw-btn--sm pw-btn--year" data-ed="' + y.id + '" aria-pressed="' + isYear + '">' + y.label + '</button></div>';
    h += '<main><div class="wrap wrap--read lift pw-enter">' + tb + (isYear ? yearBody(r, y) : periodBody(p)) + '</div></main>';
    return h;
  }
  function periodBody(p){
    var news = p.companies.filter(has), quiet = p.companies.filter(function(c){ return !has(c); });
    var h = '<div class="pw-badges meta">' + badge(p.range) + badge('Published ' + p.published) +
      badge(p.companies.length + ' companies analysed') + badge(news.length + ' with news') + '</div><div class="stack">';
    h += '<div class="pw-card"><p class="pw-eyebrow card-eyebrow">With news this period &middot; ' + news.length + '</p><div class="pw-chips">' +
      news.map(function(c){ return '<a href="#' + slug(c.name) + '">' + c.name + '</a>'; }).join('') + '</div>' +
      (quiet.length ? '<details class="pw-more"><summary><span class="pw-eyebrow">Analysed, no news this period: ' + quiet.length + '</span>' +
        '<span class="pw-btn pw-btn--text"><span class="when-closed">Show</span><span class="when-open">Hide</span></span></summary><div class="pw-chips">' +
        quiet.map(function(c){ return '<a class="is-quiet" href="#' + qid(c.name) + '">' + c.name + '</a>'; }).join('') + '</div></details>' : '') + '</div>';
    h += '<div class="pw-card"><p class="pw-eyebrow card-eyebrow">Summary</p><ul class="pw-list pw-list--ranked pw-list--summary">' + p.summary.map(function(s){
      return '<li><b><a class="pw-jump" href="#' + slug(s.name) + '">' + s.name + '</a></b> &mdash; ' + s.text + '</li>'; }).join('') + '</ul></div>';
    news.forEach(function(c, i){
      h += '<article class="pw-card pw-entry" id="' + slug(c.name) + '"><div class="pw-entry__head"><h3 class="pw-entry__name">' + c.name + (c.sub ? ' <small>' + c.sub + '</small>' : '') + '</h3>' +
        '<span class="pw-caption">' + String(i+1).padStart(2,'0') + ' / ' + String(news.length).padStart(2,'0') + '</span></div>' +
        '<p class="pw-entry__snapshot">' + c.snapshot + '</p>' + field('Recent developments', c.developments) +
        field('Partnerships and ecosystem moves', c.partnerships) + field('Messaging and positioning', c.messaging) + '</article>';
    });
    if (quiet.length) {
      h += '<section class="pw-card" id="no-news"><p class="pw-eyebrow card-eyebrow">Analysed, no significant developments this period</p>' +
        '<p class="lede-sm">' + (quiet.length === 1 ? 'This company was' : 'These ' + quiet.length + ' companies were') + ' checked for ' + p.label + '. No company-level developments, partnerships or positioning changes were found.</p>' +
        '<ul class="pw-quiet">' + quiet.map(function(c){ return '<li id="' + qid(c.name) + '"><b>' + c.name + '</b>' + (c.sub ? ' <small>' + c.sub + '</small>' : '') +
          '<span>' + c.snapshot + '</span></li>'; }).join('') + '</ul></section>';
    }
    return h + '</div>';
  }
  function yearBody(r, y){
    var chrono = r.periods.slice().reverse(), names = [], items = 0;
    r.periods[0].companies.forEach(function(c){ names.push(c.name); });
    chrono.forEach(function(p){ p.companies.forEach(function(c){ if (names.indexOf(c.name) < 0) names.push(c.name); items += has(c); }); });
    var h = '<div class="pw-badges meta">' + badge('Coverage ' + y.coverage, 'accent') + badge(r.periods.length + (r.periods.length === 1 ? ' edition' : ' editions')) +
      badge(names.length + ' companies analysed') + badge(items + ' items logged') + '</div><div class="stack">';
    h += '<div class="pw-card"><p class="pw-eyebrow card-eyebrow">' + y.label + ' highlights</p><p class="lede-sm">' + y.note + '</p><ul class="pw-list pw-list--ranked pw-list--summary">' +
      y.highlights.map(function(x){ var p = r.periods.filter(function(q){ return q.id === x.period; })[0];
        return '<li><span class="pw-badge period-tag">' + short(p.label) + '</span><b><a class="pw-jump" href="#" data-ed="' + x.period +
          '" data-to="' + slug(x.name) + '">' + x.name + '</a></b> &mdash; ' + x.text + '</li>'; }).join('') + '</ul></div>';
    h += '<div class="pw-card"><p class="pw-eyebrow card-eyebrow">Activity by company</p><p class="lede-sm">Sourced items per edition. Select a count to open that edition at the company; &mdash; means the company was not yet tracked.</p>' +
      '<div class="table-wrap"><table class="pw-table"><thead><tr><th>Company</th>' + chrono.map(function(p){ return '<th>' + p.label + '</th>'; }).join('') +
      '</tr></thead><tbody>' + names.map(function(n){
        return '<tr><td>' + n + '</td>' + chrono.map(function(p){
          var c = p.companies.filter(function(x){ return x.name === n; })[0];
          if (!c) return '<td title="Not yet tracked">&mdash;</td>';
          var k = has(c); if (!k) return '<td><span class="pw-caption">No news</span></td>';
          return '<td><button class="pw-btn pw-btn--secondary pw-btn--sm" data-ed="' + p.id + '" data-to="' + slug(n) + '">' + k + (k === 1 ? ' item' : ' items') + '</button></td>';
        }).join('') + '</tr>'; }).join('') + '</tbody></table></div></div>';
    return h + '</div>';
  }

  function scrollTo(id){ var t = document.getElementById(id); if (t) t.scrollIntoView({behavior:'smooth', block:'start'}); }
  function render(target){
    var s = parse();
    var reg = s.region ? R[s.region] : null;
    app.innerHTML = s.region ? regionView(s.region, s.edition) : overview();
    document.title = (reg ? reg.name + ' competitor analysis' : 'Competitor analyses') + ' · Seekridge';
    var last = reg ? latest(reg) : null;
    document.getElementById('next').textContent = last ? 'Next update: ' + last.nextUpdate : 'Updated every two months';
    if (target) setTimeout(function(){ scrollTo(target); }, 30); else { try { window.scrollTo(0, 0); } catch (e) {} }
  }
  app.addEventListener('click', function(e){
    var a = e.target.closest('[data-go],[data-ed],a[href^="#"]');
    if (!a) return;
    if (a.hasAttribute('data-go')) {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
      e.preventDefault(); go(a.getAttribute('data-go') || null, null); return;
    }
    if (a.hasAttribute('data-ed')) { e.preventDefault(); go(parse().region, a.getAttribute('data-ed'), a.getAttribute('data-to')); return; }
    e.preventDefault(); scrollTo(a.getAttribute('href').slice(1));
  });
  window.addEventListener('popstate', function(){ STATE = null; render(); });

  var root = document.documentElement, tbtn = document.getElementById('theme');
  function setTheme(t){ root.setAttribute('data-theme', t); tbtn.textContent = t === 'dark' ? 'Light theme' : 'Dark theme';
    try { localStorage.setItem('pw-theme', t); } catch (e) {} }
  try { var saved = localStorage.getItem('pw-theme'); if (saved) setTheme(saved); } catch (e) {}
  tbtn.addEventListener('click', function(){ setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); });

  render();
})();
</script>
</body>
</html>
